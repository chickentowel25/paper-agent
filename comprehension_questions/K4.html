<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>K4 연구 이해도 평가</title>
<style>
body{font-family:Arial;max-width:900px;margin:40px auto;padding:20px}
.user-info{margin-bottom:30px;padding:20px;background:#f5f5f5;border-radius:8px}
.user-info label{display:block;margin-bottom:10px;font-weight:600}
.user-info input[type="text"]{width:100%;padding:10px;font-size:16px;border:2px solid #ddd;border-radius:4px;margin-bottom:20px}
.mode-selection{margin-bottom:20px}
.mode-selection label{display:inline-block;margin-right:20px;cursor:pointer;padding:8px 16px;background:#fff;border:2px solid #ddd;border-radius:4px}
.mode-selection input[type="radio"]{margin-right:8px}
.mode-selection input[type="radio"]:checked + span{font-weight:600}
.question{margin-bottom:25px}
label{display:block;padding:6px;border-radius:6px;cursor:pointer}
.correct{background:#d4f7d4}
.wrong{background:#f8d0d0}
.neutral{background:#eee}
button{padding:12px 24px;font-size:16px;cursor:pointer;background:#000;color:#fff;border:none;border-radius:4px}
button:hover{background:#333}
#score{margin-top:20px;font-size:20px;font-weight:600;padding:15px;background:#f0f0f0;border-radius:4px}
</style>
</head>
<body>

<h1>K4 <em>인간 공학적 접근 방식에 기반한 VR 경험의 디자인 인종과 성별에 따른 페이스 인터페이스</em> 이해도 평가</h1>

<div class="user-info">
    <label for="userName">이름:</label>
    <input type="text" id="userName" placeholder="이름을 입력하세요" required>
    
    <div class="mode-selection">
        <label><input type="radio" name="mode" value="direct" checked><span>직접 읽기</span></label>
        <label><input type="radio" name="mode" value="text"><span>텍스트 챗봇</span></label>
        <label><input type="radio" name="mode" value="voice"><span>음성 챗봇</span></label>
    </div>
</div>

<form id="quiz"></form>
<button onclick="submitQuiz()" type="button">제출</button>
<div id="score"></div>

<script>
const questions = [
{q:"이 연구의 가장 핵심적인 목적을 가장 잘 나타내는 것은 무엇인가?",o:["VR 게임 장르별 선호도를 조사하여 콘텐츠 기획 지침을 제시하기 위해","VR HMD의 그래픽 성능을 향상시키는 렌더링 알고리즘을 개발하기 위해","인종과 성별에 따른 얼굴·두상 치수 차이가 VR HMD 페이스 인터페이스 착용감과 몰입·현존감·시뮬레이터 멀미에 미치는 영향을 분석하고, 맞춤형 인터페이스 설계 지침을 제시하기 위해","VR 기기의 가격과 보급률이 사용자 경험에 미치는 영향을 분석하기 위해"]},
{q:"이 연구에서 VR 경험 품질을 평가하기 위해 핵심적으로 사용한 지표의 조합으로 옳은 것은?",o:["유희성·난이도·점수","몰입감·현존감·시뮬레이터 멀미(SSQ)","사용 빈도·재구매 의도·브랜드 호감도","시야각·픽셀 밀도·프레임레이트"]},
{q:"연구 방법과 관련된 설명으로 옳은 것은?",o:["Hsiao의 6단계 인체측정 설계 패러다임을 적용해 페이스 인터페이스를 설계하였다.","ISO 인체공학 규격만 참고하고 별도의 인체측정 설계 절차는 사용하지 않았다.","사용자의 주관적 인터뷰만 수집하고, 어떤 계측 데이터도 수집하지 않았다.","사전 설계 없이 시판 제품만 비교 분석하였다."]},
{q:"본 연구에서 새롭게 설계한 페이스 인터페이스 유형에 대한 설명으로 가장 적절한 것은?",o:["기존 Oculus Quest 2 패턴을 그대로 사용한 단일 인터페이스 1종만 제작하였다.","Small·Medium·Large 3종은 기존 패턴을 표준편차 범위로 스케일링한 모델이며, 'Best Fit' 모델은 한국인 평균 두상 특성을 반영해 이마와 코 비율을 재설계한 모델이다.","Small·Medium·Large는 서구인 두상 데이터를 기준으로만 설계되었으며, Best Fit은 단지 크기만 줄인 축소판이다.","4종 모두 단순 색상만 다른 동일 형상의 인터페이스이다."]},
{q:"실험 참여자 구성에 대한 설명으로 옳은 것은?",o:["10대 청소년과 60대 이상 노년층을 골고루 포함한 120명","20~30대 한국인 41명과 Caucasian 39명 등 총 80명","40~50대 산업 종사자 50명","VR 경험이 풍부한 e스포츠 선수 30명"]},
{q:"이 연구에서 사용한 인체 계측 항목으로 옳은 것은?",o:["팔 길이, 손가락 길이, 어깨너비","허리둘레, 엉덩이둘레, 다리 길이","머리 둘레·머리 길이·머리 너비·광대뼈 간 거리(bizygomatic breadth)","키, 체중, BMI 지수"]},
{q:"참가자들이 체험한 VR 콘텐츠와 장비에 대한 설명으로 가장 적절한 것은?",o:["데스크톱 모니터 기반 레이싱 게임을 마우스로 조작하였다.","독립형 VR HMD인 Oculus Quest 2를 착용하고 탁구 시뮬레이션 게임 Eleven VR을 체험하였다.","스마트폰을 카드보드에 끼워 동영상만 시청하였다.","PC용 HMD와 러닝머신을 결합한 워킹 시뮬레이터를 사용하였다."]},
{q:"인종 및 성별에 따른 몰입감·현존감 차이에 대한 연구 결과로 옳은 것은?",o:["새로운 인터페이스 사용 시 한국인 참가자가 Caucasian 참가자보다 몰입감과 현존감 점수가 유의하게 높게 나타났다.","기존 인터페이스 사용 시 한국인과 Caucasian 참가자 간 점수 차이는 전혀 없었다.","새로운 인터페이스는 Caucasian 여성에게만 몰입감을 향상시키고, 다른 집단에는 영향을 주지 않았다.","인종·성별에 따른 차이는 시뮬레이터 멀미에만 나타나고, 몰입감과 현존감에는 나타나지 않았다."]},
{q:"논문에서 언급한 Break-In Presence(BIP)에 대한 설명으로 가장 적절한 것은?",o:["사용자가 VR 기기를 벗고 현실 환경으로 완전히 돌아온 상태","가상환경과 무관한 외부 자극·기기 불편 등으로 인해 현존감이 끊기고 주의가 현실로 돌아가는 현상","네트워크 끊김으로 인해 VR 콘텐츠가 강제 종료되는 기술적 오류","배터리가 소진되어 기기가 꺼지는 상황"]},
{q:"본 연구의 결론 및 디자인 시사점으로 옳은 것은?",o:["인종·성별을 고려하지 않은 단일 규격 설계가 생산 효율성 측면에서 가장 바람직하다.","시각적 그래픽 품질만 향상시키면 몰입감과 현존감이 충분히 개선되므로, 페이스 인터페이스 설계는 부차적이다.","광대뼈 너비와 머리 길이 등 인체 계측 데이터를 반영한 맞춤형 페이스 인터페이스 설계는 몰입감·현존감 향상과 시뮬레이터 멀미 완화에 기여할 수 있으며, 향후 VR HMD 개발에서 인종·성별 특성을 고려한 인간공학적 설계가 중요하다.","페이스 인터페이스는 탈착식으로 제공하지 말고 완전히 고정형으로 만들어야 한다."]}
];
const answers = [2,1,0,1,1,2,1,0,1,2];

const quiz=document.getElementById("quiz");
questions.forEach((q,i)=>{
 let d=document.createElement("div");d.className="question";
 d.innerHTML=`<p>${i+1}. ${q.q}</p>`;
 q.o.forEach((t,j)=>{
  d.innerHTML+=`<label><input type="radio" name="q${i}" value="${j}">${t}</label>`;
 });
 quiz.appendChild(d);
});

const paperId = 'K4';

async function submitQuiz(){
 const userName = document.getElementById("userName").value.trim();
 if(!userName){
  alert("이름을 입력해주세요.");
  return;
 }
 
 const selectedMode = document.querySelector('input[name="mode"]:checked').value;
 let s=0;
 questions.forEach((_,i)=>{
  const sel=document.querySelector(`input[name=q${i}]:checked`);
  document.querySelectorAll(`input[name=q${i}]`).forEach(inp=>{
    let l=inp.parentElement;
    l.classList.remove("correct","wrong","neutral");
    if(inp.value==answers[i])l.classList.add("correct");
    else if(sel&&inp===sel)l.classList.add("wrong");
    else l.classList.add("neutral");
  });
  if(sel&&sel.value==answers[i])s++;
 });
 
 const totalQuestions = questions.length;
 const accuracy = (s / totalQuestions * 100).toFixed(1);
 document.getElementById("score").innerText=`점수: ${s} / ${totalQuestions} (정답률: ${accuracy}%)`;
 
 // 오답 문제 번호 수집 (1부터 시작)
 const wrongAnswers = [];
 questions.forEach((_,i)=>{
  const sel=document.querySelector(`input[name=q${i}]:checked`);
  if(!sel || sel.value != answers[i]){
   wrongAnswers.push(i + 1); // 문제 번호는 1부터 시작
  }
 });
 
 // JSON 데이터 생성
 const resultData = {
  name: userName,
  paper: paperId,
  mode: selectedMode,
  score: s,
  wrong_answers: wrongAnswers,
  timestamp: new Date().toISOString()
 };
 
 // 서버에 저장
 try {
  const response = await fetch('http://localhost:4000/api/save-result', {
   method: 'POST',
   headers: {
    'Content-Type': 'application/json'
   },
   body: JSON.stringify(resultData)
  });
  
  if(!response.ok){
   throw new Error('저장 실패');
  }
  
  console.log('결과가 저장되었습니다.');
 } catch(error){
  console.error('저장 오류:', error);
  // 오프라인일 경우 로컬 스토리지에 저장
  localStorage.setItem(`result_${userName}_${paperId}_${Date.now()}`, JSON.stringify(resultData));
  alert('서버 연결 실패. 로컬에 저장되었습니다.');
 }
}
</script>
</body>
</html>
