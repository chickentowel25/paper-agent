<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>K7 연구 이해도 평가</title>
<style>
body{font-family:Arial;max-width:900px;margin:40px auto;padding:20px}
.user-info{margin-bottom:30px;padding:20px;background:#f5f5f5;border-radius:8px}
.user-info label{display:block;margin-bottom:10px;font-weight:600}
.user-info input[type="text"]{width:100%;padding:10px;font-size:16px;border:2px solid #ddd;border-radius:4px;margin-bottom:20px}
.mode-selection{margin-bottom:20px}
.mode-selection label{display:inline-block;margin-right:20px;cursor:pointer;padding:8px 16px;background:#fff;border:2px solid #ddd;border-radius:4px}
.mode-selection input[type="radio"]{margin-right:8px}
.mode-selection input[type="radio"]:checked + span{font-weight:600}
.question{margin-bottom:25px}
label{display:block;padding:6px;border-radius:6px;cursor:pointer}
.correct{background:#d4f7d4}
.wrong{background:#f8d0d0}
.neutral{background:#eee}
button{padding:12px 24px;font-size:16px;cursor:pointer;background:#000;color:#fff;border:none;border-radius:4px}
button:hover{background:#333}
#score{margin-top:20px;font-size:20px;font-weight:600;padding:15px;background:#f0f0f0;border-radius:4px}
</style>
</head>
<body>

<h1>K7 <em>대화형 인공지능 에이전트와 공감적 소통을 위한 눈 형태 UI 디자인 제안 기쁨의 감정을 중</em> 이해도 평가</h1>

<div class="user-info">
    <label for="userName">이름:</label>
    <input type="text" id="userName" placeholder="이름을 입력하세요" required>
    
    <div class="mode-selection">
        <label><input type="radio" name="mode" value="direct" checked><span>직접 읽기</span></label>
        <label><input type="radio" name="mode" value="text"><span>텍스트 챗봇</span></label>
        <label><input type="radio" name="mode" value="voice"><span>음성 챗봇</span></label>
    </div>
</div>

<form id="quiz"></form>
<button onclick="submitQuiz()" type="button">제출</button>
<div id="score"></div>

<script>
const questions = [
{q:"이 연구의 가장 핵심적인 목적을 가장 잘 나타내는 것은 무엇인가?",o:["기쁨 감정 인식을 위한 음성 분석 알고리즘을 개발하기 위해","다양한 정서 상태에서 대화형 인공지능의 응답 속도를 향상시키기 위해","기쁨의 감정 대화에서 눈 형태 UI 디자인을 적용해, 대화형 인공지능 에이전트에 대한 사용자의 공감도(인지적·정서적·태도적)를 증진시키는 새로운 인터랙션 방식을 제안하기 위해","실제 인간 눈을 사실적으로 렌더링하는 3D 그래픽 엔진을 개발하기 위해"]},
{q:"이 연구에서 다루는 공감의 구성 요인 세 가지 조합으로 옳은 것은?",o:["인지적 공감, 정서적 공감, 태도적 공감","인지적 공감, 행동적 공감, 사회적 공감","정서적 공감, 신체적 공감, 문화적 공감","태도적 공감, 언어적 공감, 비언어적 공감"]},
{q:"기쁨의 감정 강도 구분에 대한 설명으로 옳은 것은?",o:["슬픔, 중립, 분노 세 단계로 구분하였다.","약한 기쁨, 중간 기쁨, 강한 기쁨 세 단계로 정의하고, 각 강도에 해당하는 감성 어휘와 상황을 선행·예비 연구로 도출하였다.","평온함과 황홀함 두 단계로만 구분하였다.","강한 기쁨만 집중적으로 다루고 약한 기쁨은 배제하였다."]},
{q:"기쁨의 눈 형태를 정의하기 위해 추출한 \"형태 요소\"에 해당하는 것으로 옳은 것은?",o:["눈 모양, 눈동자 위치, 아래 눈꺼풀 위치","눈썹 색, 동공 색, 홍채 패턴","이마 주름, 입꼬리 각도, 턱선 높이","눈 깜빡임 빈도, 얼굴 각도, 시선 방향"]},
{q:"눈 형태 UI 디자인의 구조와 표현 방식에 대한 설명으로 가장 적절한 것은?",o:["실제 인간 눈 사진을 그대로 사용하여 사실성을 극대화했다.","눈동자는 중심의 원, 아래 눈꺼풀은 바깥의 원으로 추상화하여 표현하고, 감정 강도에 따라 중심 원의 위치와 크기, 바깥 원의 게이지 형태를 변화시키도록 구성하였다.","눈 형태는 고정하고, 배경 색만 바꾸어 감정 강도를 표현하였다.","색상 변화만으로 기쁨의 강도를 표현하고, 형태 변화는 사용하지 않았다."]},
{q:"공감도 실험의 참여자 구성에 대한 설명으로 옳은 것은?",o:["대화형 인공지능 사용 경험이 없는 초등학생 89명","10대~60대 전 연령층 200명","대화형 인공지능 에이전트를 1회 이상 사용한 성인 89명(남성 43명, 여성 46명)으로, 눈 형태 UI 적용 집단 44명과 미적용 집단 45명으로 나누어 온라인 실험을 진행하였다.","특정 IT 기업 종사자 50명을 대상으로 오프라인 실험만 진행하였다."]},
{q:"이 연구에서 제작한 실험 자극물(영상)에 대한 설명으로 옳은 것은?",o:["텍스트만 제시되고 시각적 UI는 포함되지 않았다.","눈 형태 UI 적용 집단(A)은 기쁨의 강도별 눈 형태 UI와 공감 대화가 함께 제시되며, 미적용 집단(B)은 동일한 언어적 피드백을 유지한 채 눈동자 형태가 없는 단순 UI로 구성되었다.","강한 기쁨 상황 영상만 사용하고, 약·중간 기쁨은 제외하였다.","각 집단마다 서로 다른 대화 내용과 감정 유형을 사용하였다."]},
{q:"공감도 실험 결과에 대한 설명으로 가장 적절한 것은?",o:["모든 강도의 기쁨에서 눈 형태 UI 미적용 집단(B)이 적용 집단(A)보다 공감도가 높게 나타났다.","약한 기쁨에서만 유의한 차이가 있었고, 중간·강한 기쁨에서는 차이가 없었다.","모든 강도의 기쁨에서 눈 형태 UI 적용 집단(A)의 공감도가 미적용 집단(B)보다 유의미하게 높게 나타났다.","강한 기쁨에서만 차이가 나타났고, 약·중간 기쁨에서는 미적용 집단의 공감도가 더 높았다."]},
{q:"공감 구성 요소별(인지·정서·태도) 차이 분석 결과에 대한 설명으로 옳은 것은?",o:["약한 기쁨에서는 세 공감 요인 모두에서 차이가 없었다.","중간 기쁨과 강한 기쁨에서는 인지·정서·태도 공감 모두에서 눈 형태 UI 적용 집단의 점수가 더 높았고, 특히 태도적 공감에서 가장 큰 차이가 나타났다.","강한 기쁨에서는 정서적 공감만 차이가 있었고, 인지·태도 공감은 차이가 없었다.","세 강도 모두 인지적 공감에서만 차이가 있었고, 정서·태도 공감에는 차이가 없었다."]},
{q:"논문의 결론 및 시사점에 대한 설명으로 가장 적절한 것은?",o:["언어적 피드백만으로도 충분한 공감 형성이 가능하므로, 눈 형태 UI와 같은 시각적 피드백은 불필요하다.","눈 형태 UI 디자인은 공감도에 영향을 주지 않으므로, 향후 연구에서는 전적으로 음성 인터페이스만 다루어야 한다.","기쁨의 감정 대화에서 눈 형태 UI를 통한 시각적 피드백은 대화형 인공지능 에이전트에 대한 공감도를 특히 태도적 공감 차원에서 크게 향상시키며, 작은 화면에서는 약한 기쁨 표현을 더 명확히 인지할 수 있도록 형태·움직임을 조정할 필요가 있다.","공감도 향상을 위해서는 사실적인 눈 이미지가 필수이며, 추상적 형태는 사용하지 않는 것이 좋다고 결론 내렸다."]}
];
const answers = [2,0,1,0,1,2,1,2,1,2];

const quiz=document.getElementById("quiz");
questions.forEach((q,i)=>{
 let d=document.createElement("div");d.className="question";
 d.innerHTML=`<p>${i+1}. ${q.q}</p>`;
 q.o.forEach((t,j)=>{
  d.innerHTML+=`<label><input type="radio" name="q${i}" value="${j}">${t}</label>`;
 });
 quiz.appendChild(d);
});

const paperId = 'K7';

async function submitQuiz(){
 const userName = document.getElementById("userName").value.trim();
 if(!userName){
  alert("이름을 입력해주세요.");
  return;
 }
 
 const selectedMode = document.querySelector('input[name="mode"]:checked').value;
 let s=0;
 questions.forEach((_,i)=>{
  const sel=document.querySelector(`input[name=q${i}]:checked`);
  document.querySelectorAll(`input[name=q${i}]`).forEach(inp=>{
    let l=inp.parentElement;
    l.classList.remove("correct","wrong","neutral");
    if(inp.value==answers[i])l.classList.add("correct");
    else if(sel&&inp===sel)l.classList.add("wrong");
    else l.classList.add("neutral");
  });
  if(sel&&sel.value==answers[i])s++;
 });
 
 const totalQuestions = questions.length;
 const accuracy = (s / totalQuestions * 100).toFixed(1);
 document.getElementById("score").innerText=`점수: ${s} / ${totalQuestions} (정답률: ${accuracy}%)`;
 
 // 오답 문제 번호 수집 (1부터 시작)
 const wrongAnswers = [];
 questions.forEach((_,i)=>{
  const sel=document.querySelector(`input[name=q${i}]:checked`);
  if(!sel || sel.value != answers[i]){
   wrongAnswers.push(i + 1); // 문제 번호는 1부터 시작
  }
 });
 
 // JSON 데이터 생성
 const resultData = {
  name: userName,
  paper: paperId,
  mode: selectedMode,
  score: s,
  wrong_answers: wrongAnswers,
  timestamp: new Date().toISOString()
 };
 
 // 서버에 저장
 try {
  const response = await fetch('http://localhost:4000/api/save-result', {
   method: 'POST',
   headers: {
    'Content-Type': 'application/json'
   },
   body: JSON.stringify(resultData)
  });
  
  if(!response.ok){
   throw new Error('저장 실패');
  }
  
  console.log('결과가 저장되었습니다.');
 } catch(error){
  console.error('저장 오류:', error);
  // 오프라인일 경우 로컬 스토리지에 저장
  localStorage.setItem(`result_${userName}_${paperId}_${Date.now()}`, JSON.stringify(resultData));
  alert('서버 연결 실패. 로컬에 저장되었습니다.');
 }
}
</script>
</body>
</html>
