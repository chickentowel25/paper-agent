<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Paper Agent">
    <title>Paper Agent - 텍스트 대화</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-page">
    <header>
        <div class="timer" id="timer">05:00</div>
    </header>

    <main>
        <div class="chat-area" id="chatArea">
            <!-- 사용자가 먼저 질문을 시작합니다 -->
        </div>

        <div class="input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="메시지를 입력하세요..."
                autocomplete="off"
            >
            <button id="sendBtn">전송</button>
        </div>
    </main>

    <script>
        let sessionId = null;
        let timerInterval = null;
        let timeLeft = 300; // 5분 = 300초

        // 타이머 업데이트
        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                endSession();
            } else {
                timeLeft--;
            }
        }

        // 세션 초기화
        async function initializeSession() {
            const paperFilename = localStorage.getItem('selectedPaper');
            if (!paperFilename) {
                alert('논문이 선택되지 않았습니다. 홈으로 돌아갑니다.');
                window.location.href = '/home.html';
                return;
            }

            try {
                const response = await fetch('/api/conversation/initialize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        paperFilename: paperFilename,
                        mode: 'text'
                    })
                });

                const data = await response.json();
                if (data.success) {
                    sessionId = data.sessionId;
                    
                    // 타이머 시작
                    timerInterval = setInterval(updateTimer, 1000);
                    
                    // 입력창 포커스
                    document.getElementById('messageInput').focus();
                } else {
                    alert('세션 초기화 실패: ' + data.error);
                }
            } catch (error) {
                console.error('세션 초기화 오류:', error);
                alert('서버 연결 오류가 발생했습니다.');
            }
        }

        // 메시지 전송
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !sessionId) return;

            input.value = '';
            addMessage('user', message);

            try {
                const response = await fetch('/api/conversation/text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        message: message
                    })
                });

                const data = await response.json();
                if (data.success) {
                    addMessage('assistant', data.response);
                } else {
                    alert('응답 생성 실패: ' + data.error);
                }
            } catch (error) {
                console.error('메시지 전송 오류:', error);
                alert('서버 오류가 발생했습니다.');
            }

            input.focus();
        }

        // 메시지 추가
        function addMessage(role, content) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `<div class="message-content">${content}</div>`;
            chatArea.appendChild(messageDiv);
            
            // 마지막 말풍선이 입력창 바로 위까지 스크롤
            setTimeout(() => {
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 10);
        }

        // 세션 종료
        async function endSession() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            if (sessionId) {
                try {
                    await fetch('/api/conversation/end', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId: sessionId })
                    });
                } catch (error) {
                    console.error('세션 종료 오류:', error);
                }
            }

            alert('5분 시간이 종료되었습니다. 대화 로그가 저장되었습니다.');
            window.location.href = '/home.html';
        }

        // Visual Viewport API로 키보드 높이 변화 감지 및 입력창 위치 조정
        let keyboardHeight = 0;
        
        function handleViewportResize() {
            if (window.visualViewport) {
                const viewport = window.visualViewport;
                const body = document.body;
                const header = document.querySelector('header');
                const inputArea = document.querySelector('.input-area');
                const chatArea = document.querySelector('.chat-area');
                
                // visualViewport의 높이를 body 높이로 설정
                body.style.height = `${viewport.height}px`;
                body.style.position = 'fixed';
                body.style.width = '100%';
                body.style.top = '0';
                body.style.left = '0';
                body.style.overflow = 'hidden';
                
                // 키보드가 올라온 경우 입력창 위치 조정
                const windowHeight = window.innerHeight;
                const viewportHeight = viewport.height;
                keyboardHeight = windowHeight - viewportHeight;
                
                // 헤더를 항상 상단에 고정
                if (header) {
                    header.style.position = 'fixed';
                    header.style.top = '0';
                    header.style.left = '0';
                    header.style.right = '0';
                    header.style.width = '100%';
                    header.style.zIndex = '100';
                }
                
                if (keyboardHeight > 0) {
                    // 키보드가 올라온 경우: 입력창을 키보드 위에 위치
                    inputArea.style.bottom = `${keyboardHeight}px`;
                    inputArea.style.position = 'fixed';
                    inputArea.style.left = '0';
                    inputArea.style.right = '0';
                    inputArea.style.width = '100%';
                    inputArea.style.zIndex = '1000';
                } else {
                    // 키보드가 내려간 경우: 원래 위치로
                    inputArea.style.bottom = '0';
                    inputArea.style.position = 'fixed';
                    inputArea.style.left = '0';
                    inputArea.style.right = '0';
                    inputArea.style.width = '100%';
                    inputArea.style.zIndex = '1000';
                }
                
                // chat-area의 높이 조정 (헤더와 입력창 사이에 끼워넣기)
                if (chatArea) {
                    const headerHeight = header ? header.offsetHeight : 0;
                    const inputAreaHeight = inputArea ? inputArea.offsetHeight : 0;
                    
                    // 키보드가 올라온 경우와 내려간 경우 모두 동일하게 계산
                    // viewport 높이에서 header와 inputArea 높이를 빼면 chat-area 높이
                    const availableHeight = viewportHeight - headerHeight - inputAreaHeight;
                    
                    chatArea.style.height = `${availableHeight}px`;
                    chatArea.style.position = 'fixed';
                    chatArea.style.top = `${headerHeight}px`;
                    chatArea.style.left = '0';
                    chatArea.style.right = '0';
                    chatArea.style.width = '100%';
                    chatArea.style.bottom = 'auto';
                }
            }
        }

        // Visual Viewport 이벤트 리스너
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', handleViewportResize);
            // scroll 이벤트는 제거 - 헤더와 입력창은 고정, chat-area만 스크롤
        } else {
            // visualViewport를 지원하지 않는 경우 대체 방법
            let initialHeight = window.innerHeight;
            const header = document.querySelector('header');
            const inputArea = document.querySelector('.input-area');
            const chatArea = document.querySelector('.chat-area');
            
            function updateLayout() {
                const currentHeight = window.innerHeight;
                const keyboardHeight = initialHeight - currentHeight;
                
                document.body.style.height = `${currentHeight}px`;
                document.body.style.position = 'fixed';
                document.body.style.width = '100%';
                document.body.style.top = '0';
                document.body.style.left = '0';
                document.body.style.overflow = 'hidden';
                
                // 헤더는 항상 상단 고정 (로직 변경 없음)
                if (header) {
                    header.style.position = 'fixed';
                    header.style.top = '0';
                    header.style.left = '0';
                    header.style.right = '0';
                    header.style.width = '100%';
                    header.style.zIndex = '100';
                }
                
                // 입력창 위치 조정 (로직 변경 없음)
                if (keyboardHeight > 0) {
                    inputArea.style.bottom = `${keyboardHeight}px`;
                    inputArea.style.position = 'fixed';
                } else {
                    inputArea.style.bottom = '0';
                    inputArea.style.position = 'fixed';
                }
                inputArea.style.left = '0';
                inputArea.style.right = '0';
                inputArea.style.width = '100%';
                inputArea.style.zIndex = '1000';
                
                // chat-area만 높이 조정 (header와 입력창 사이에 끼워넣기)
                if (chatArea) {
                    const headerHeight = header ? header.offsetHeight : 0;
                    const inputAreaHeight = inputArea ? inputArea.offsetHeight : 0;
                    const availableHeight = currentHeight - headerHeight - inputAreaHeight;
                    
                    chatArea.style.height = `${availableHeight}px`;
                    chatArea.style.position = 'fixed';
                    chatArea.style.top = `${headerHeight}px`;
                    chatArea.style.left = '0';
                    chatArea.style.right = '0';
                    chatArea.style.width = '100%';
                    chatArea.style.bottom = 'auto';
                }
            }
            
            window.addEventListener('resize', updateLayout);
            updateLayout(); // 초기 설정
        }

        // 초기 높이 설정
        if (window.visualViewport) {
            handleViewportResize();
        }

        // 페이지 전체 스크롤 방지 (chat-area 제외)
        function preventBodyScroll(e) {
            const chatArea = document.querySelector('.chat-area');
            const target = e.target;
            
            // chat-area 내부가 아니면 스크롤 방지
            if (!chatArea || !chatArea.contains(target)) {
                e.preventDefault();
            }
        }

        // html과 body 스크롤 방지 (text 페이지에서만)
        document.documentElement.style.overflow = 'hidden';
        document.documentElement.style.height = '100%';
        document.documentElement.style.position = 'fixed';
        document.documentElement.style.width = '100%';

        // 터치 스크롤 방지
        document.addEventListener('touchmove', preventBodyScroll, { passive: false });
        document.addEventListener('wheel', preventBodyScroll, { passive: false });
        
        // chat-area는 스크롤 허용하되, 위로 스크롤 제한
        const chatArea = document.querySelector('.chat-area');
        if (chatArea) {
            // 위로 스크롤 방지 (기본 상태 이상으로)
            let initialScrollTop = 0;
            
            chatArea.addEventListener('scroll', () => {
                // 스크롤이 초기 위치(0) 이상으로 올라가는 것을 방지
                if (chatArea.scrollTop < 0) {
                    chatArea.scrollTop = 0;
                }
            });
            
            chatArea.addEventListener('touchmove', (e) => {
                // chat-area 내부 스크롤은 허용
                e.stopPropagation();
            }, { passive: true });
            
            // 휠 이벤트로 위로 스크롤 방지
            chatArea.addEventListener('wheel', (e) => {
                if (chatArea.scrollTop <= 0 && e.deltaY < 0) {
                    // 맨 위에 있고 위로 스크롤하려고 하면 방지
                    e.preventDefault();
                }
            }, { passive: false });
        }

        // 이벤트 리스너
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 입력창 포커스/블러 이벤트로 추가 조정
        const messageInput = document.getElementById('messageInput');
        messageInput.addEventListener('focus', () => {
            // 포커스 시 약간의 지연 후 조정 (키보드 애니메이션 대기)
            setTimeout(() => {
                handleViewportResize();
            }, 300);
        });
        
        messageInput.addEventListener('blur', () => {
            // 포커스 해제 시 약간의 지연 후 조정 (키보드 애니메이션 대기)
            setTimeout(() => {
                handleViewportResize();
            }, 300);
        });

        // 페이지 로드 시 세션 초기화
        initializeSession();
    </script>
    <script src="/register-sw.js"></script>
</body>
</html>
