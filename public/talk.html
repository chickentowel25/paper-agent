<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Agent - 음성 대화</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container talk-container">
        <header>
            <div class="timer" id="timer">05:00</div>
        </header>

        <main>
            <div class="controls">
                <button class="mic-btn" id="micBtn">
                    <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <script src="STT.js"></script>
    <script>
        let sessionId = null;
        let timerInterval = null;
        let timeLeft = 300; // 5분 = 300초
        let sttInstance = null;
        let isRecording = false;
        let currentAudio = null; // 현재 재생 중인 오디오 객체

        // 타이머 업데이트
        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                endSession();
            } else {
                timeLeft--;
            }
        }

        // 세션 초기화
        async function initializeSession() {
            const paperFilename = localStorage.getItem('selectedPaper');
            if (!paperFilename) {
                alert('논문이 선택되지 않았습니다. 홈으로 돌아갑니다.');
                window.location.href = '/home.html';
                return;
            }

            try {
                const response = await fetch('/api/conversation/initialize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        paperFilename: paperFilename,
                        mode: 'talk'
                    })
                });

                const data = await response.json();
                if (data.success) {
                    sessionId = data.sessionId;

                    // 타이머 시작
                    timerInterval = setInterval(updateTimer, 1000);
                    
                    // STT 초기화
                    initializeSTT();
                } else {
                    alert('세션 초기화 실패: ' + data.error);
                }
            } catch (error) {
                console.error('세션 초기화 오류:', error);
                alert('서버 연결 오류가 발생했습니다.');
            }
        }

        // STT 초기화
        function initializeSTT() {
            if (!window.WebSpeechSTT) {
                alert('Web Speech API를 지원하지 않는 브라우저입니다. Chrome 또는 Edge를 사용해주세요.');
                return;
            }

            sttInstance = window.WebSpeechSTT.initialize({
                lang: 'ko-KR',
                onResult: (transcript, isFinal, confidence) => {
                    if (isFinal && transcript) {
                        sendMessage(transcript);
                    }
                },
                onError: (error) => {
                    console.error('STT 오류:', error);
                },
                onStart: () => {
                    isRecording = true;
                },
                onEnd: (finalTranscript) => {
                    isRecording = false;
                }
            });
        }

        // 현재 재생 중인 오디오 중지
        function stopCurrentAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
        }

        // 마이크 버튼 이벤트
        const micBtn = document.getElementById('micBtn');
        
        micBtn.addEventListener('mousedown', () => {
            // 에이전트 발화 중지
            stopCurrentAudio();
            
            if (sttInstance && !isRecording) {
                sttInstance.start();
                micBtn.classList.add('active');
            }
        });

        micBtn.addEventListener('mouseup', () => {
            if (sttInstance && isRecording) {
                sttInstance.stop();
                micBtn.classList.remove('active');
            }
        });

        micBtn.addEventListener('mouseleave', () => {
            if (sttInstance && isRecording) {
                sttInstance.stop();
                micBtn.classList.remove('active');
            }
        });

        // 터치 이벤트
        micBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            // 에이전트 발화 중지
            stopCurrentAudio();
            
            if (sttInstance && !isRecording) {
                sttInstance.start();
                micBtn.classList.add('active');
            }
        });

        micBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (sttInstance && isRecording) {
                sttInstance.stop();
                micBtn.classList.remove('active');
            }
        });

        // 메시지 전송
        async function sendMessage(transcript) {
            if (!sessionId || !transcript) return;

            try {
                const response = await fetch('/api/conversation/talk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        transcript: transcript
                    })
                });

                const data = await response.json();
                if (data.success) {
                    // TTS 재생
                    if (data.audioBase64) {
                        playAudio(data.audioBase64);
                    }
                } else {
                    alert('응답 생성 실패: ' + data.error);
                }
            } catch (error) {
                console.error('메시지 전송 오류:', error);
                alert('서버 오류가 발생했습니다.');
            }
        }

        // 오디오 재생
        function playAudio(base64Audio) {
            // 기존 오디오가 재생 중이면 중지
            stopCurrentAudio();
            
            const audio = new Audio('data:audio/mp3;base64,' + base64Audio);
            currentAudio = audio;
            
            // 오디오 재생 완료 시 변수 초기화
            audio.addEventListener('ended', () => {
                currentAudio = null;
            });
            
            // 오디오 재생 중 오류 발생 시 변수 초기화
            audio.addEventListener('error', () => {
                currentAudio = null;
            });
            
            audio.play().catch(error => {
                console.error('오디오 재생 오류:', error);
                currentAudio = null;
            });
        }

        // 세션 종료
        async function endSession() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            if (sttInstance && isRecording) {
                sttInstance.stop();
            }

            // 재생 중인 오디오 중지
            stopCurrentAudio();

            if (sessionId) {
                try {
                    await fetch('/api/conversation/end', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId: sessionId })
                    });
                } catch (error) {
                    console.error('세션 종료 오류:', error);
                }
            }

            alert('5분 시간이 종료되었습니다. 대화 로그가 저장되었습니다.');
            window.location.href = '/home.html';
        }

        // 페이지 로드 시 세션 초기화
        initializeSession();
    </script>
</body>
</html>
