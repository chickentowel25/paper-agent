<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Paper Agent">
    <title>Paper Agent - 음성 대화</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container talk-container">
        <header>
            <div class="timer" id="timer">05:00</div>
        </header>

        <main>
            <div class="controls">
                <button class="mic-btn" id="micBtn">
                    <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <script src="STT.js"></script>
    <script>
        let sessionId = null;
        let timerInterval = null;
        let timeLeft = 300; // 5분 = 300초
        let sttInstance = null;
        let isRecording = false;
        let currentAudio = null; // 현재 재생 중인 오디오 객체
        let latestRequestId = 0; // 가장 최근 요청 ID
        let pendingRequests = new Set(); // 진행 중인 요청 ID들

        // 타이머 업데이트
        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                endSession();
            } else {
                timeLeft--;
            }
        }

        // 세션 초기화
        async function initializeSession() {
            const paperFilename = localStorage.getItem('selectedPaper');
            if (!paperFilename) {
                alert('논문이 선택되지 않았습니다. 홈으로 돌아갑니다.');
                window.location.href = '/home.html';
                return;
            }

            try {
                const response = await fetch('/api/conversation/initialize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        paperFilename: paperFilename,
                        mode: 'talk'
                    })
                });

                const data = await response.json();
                if (data.success) {
                    sessionId = data.sessionId;

                    // 타이머 시작
                    timerInterval = setInterval(updateTimer, 1000);
                    
                    // STT 초기화
                    initializeSTT();
                } else {
                    alert('세션 초기화 실패: ' + data.error);
                }
            } catch (error) {
                console.error('세션 초기화 오류:', error);
                alert('서버 연결 오류가 발생했습니다.');
            }
        }

        // STT 초기화
        function initializeSTT() {
            if (!window.WebSpeechSTT) {
                alert('Web Speech API를 지원하지 않는 브라우저입니다. Chrome 또는 Edge를 사용해주세요.');
                return;
            }

            sttInstance = window.WebSpeechSTT.initialize({
                lang: 'ko-KR',
                onResult: (transcript, isFinal, confidence) => {
                    if (isFinal && transcript) {
                        sendMessage(transcript);
                    }
                },
                onError: (error) => {
                    console.error('STT 오류:', error);
                },
                onStart: () => {
                    isRecording = true;
                },
                onEnd: (finalTranscript) => {
                    isRecording = false;
                }
            });
        }

        // 현재 재생 중인 오디오 중지
        function stopCurrentAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
        }

        // 모든 진행 중인 요청 취소
        function cancelPendingRequests() {
            // 진행 중인 모든 요청을 취소 처리
            pendingRequests.clear();
            // 현재 재생 중인 오디오도 중지
            stopCurrentAudio();
        }

        // 마이크 버튼 토글 함수
        function toggleRecording() {
            if (!sttInstance) return;

            if (isRecording) {
                // 녹음 중이면 중지
                sttInstance.stop();
                micBtn.classList.remove('active');
            } else {
                // 녹음 중이 아니면 시작
                // 에이전트 발화 중지 및 진행 중인 요청 취소
                cancelPendingRequests();
                sttInstance.start();
                micBtn.classList.add('active');
            }
        }

        // 마이크 버튼 이벤트
        const micBtn = document.getElementById('micBtn');
        
        // 클릭 이벤트 (마우스)
        micBtn.addEventListener('click', (e) => {
            e.preventDefault();
            toggleRecording();
        });

        // 터치 이벤트
        micBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            toggleRecording();
        });

        // 메시지 전송
        async function sendMessage(transcript) {
            if (!sessionId || !transcript) return;

            // 새로운 요청 ID 생성
            latestRequestId++;
            const requestId = latestRequestId;
            pendingRequests.add(requestId);

            try {
                const response = await fetch('/api/conversation/talk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        transcript: transcript
                    })
                });

                const data = await response.json();
                
                // 이 요청이 가장 최근 요청인지 확인
                if (!pendingRequests.has(requestId)) {
                    // 이미 취소된 요청이면 무시
                    return;
                }

                if (requestId !== latestRequestId) {
                    // 더 최근 요청이 있으면 이 응답은 무시
                    pendingRequests.delete(requestId);
                    return;
                }

                if (data.success) {
                    // 진행 중인 요청에서 제거
                    pendingRequests.delete(requestId);
                    
                    // TTS 재생
                    if (data.audioBase64) {
                        playAudio(data.audioBase64, requestId);
                    }
                } else {
                    pendingRequests.delete(requestId);
                    alert('응답 생성 실패: ' + data.error);
                }
            } catch (error) {
                pendingRequests.delete(requestId);
                console.error('메시지 전송 오류:', error);
                // 네트워크 오류는 조용히 처리 (사용자가 이미 새로운 요청을 했을 수 있음)
            }
        }

        // 오디오 재생
        function playAudio(base64Audio, requestId) {
            // 이 요청이 여전히 가장 최근 요청인지 확인
            if (requestId !== latestRequestId) {
                // 더 최근 요청이 있으면 이 오디오는 재생하지 않음
                return;
            }

            // 기존 오디오가 재생 중이면 중지
            stopCurrentAudio();
            
            const audio = new Audio('data:audio/mp3;base64,' + base64Audio);
            currentAudio = audio;
            
            // 오디오 재생 완료 시 변수 초기화
            audio.addEventListener('ended', () => {
                if (currentAudio === audio) {
                    currentAudio = null;
                }
            });
            
            // 오디오 재생 중 오류 발생 시 변수 초기화
            audio.addEventListener('error', () => {
                if (currentAudio === audio) {
                    currentAudio = null;
                }
            });
            
            audio.play().catch(error => {
                console.error('오디오 재생 오류:', error);
                if (currentAudio === audio) {
                    currentAudio = null;
                }
            });
        }

        // 세션 종료
        async function endSession() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            if (sttInstance && isRecording) {
                sttInstance.stop();
            }

            // 재생 중인 오디오 중지
            stopCurrentAudio();

            if (sessionId) {
                try {
                    await fetch('/api/conversation/end', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ sessionId: sessionId })
                    });
                } catch (error) {
                    console.error('세션 종료 오류:', error);
                }
            }

            alert('5분 시간이 종료되었습니다. 대화 로그가 저장되었습니다.');
            window.location.href = '/home.html';
        }

        // 페이지 로드 시 세션 초기화
        initializeSession();
    </script>
    <script src="/register-sw.js"></script>
</body>
</html>
