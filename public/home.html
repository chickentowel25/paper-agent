<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Paper Agent">
    <meta name="description" content="HCI 논문을 빠르게 이해하기 위한 AI 에이전트">
    <title>Paper Agent - 논문 선택</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container home-container">


        <main>
            <section class="paper-selection">
                <h2>논문 선택</h2>
                <div class="paper-list" id="paperList">
                    <div class="loading">논문 목록을 불러오는 중...</div>
                </div>
            </section>

            <section class="mode-selection">
                <h2>상호작용 모드 선택</h2>
                <div class="mode-buttons">
                    <button class="mode-btn" data-mode="text">
                        <svg class="mode-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                        </svg>
                        <span class="mode-label">Text</span>
                    </button>
                    <button class="mode-btn" data-mode="talk">
                        <svg class="mode-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                        </svg>
                        <span class="mode-label">Talk</span>
                    </button>
                </div>
            </section>

            <button class="start-btn" id="startBtn" disabled>
                시작하기
            </button>
        </main>
    </div>

    <script>
        let selectedPaper = null;
        let selectedMode = null;

        // 논문 목록 가져오기
        async function loadPapers() {
            try {
                const response = await fetch('/api/papers');
                const data = await response.json();
                
                if (data.success) {
                    const paperList = document.getElementById('paperList');
                    paperList.innerHTML = '';
                    
                    data.papers.forEach(paper => {
                        const paperItem = document.createElement('div');
                        paperItem.className = 'paper-item';
                        paperItem.dataset.filename = paper.filename;
                        paperItem.innerHTML = `
                            <div class="paper-title">${paper.title}</div>
                        `;
                        paperItem.addEventListener('click', () => {
                            document.querySelectorAll('.paper-item').forEach(item => {
                                item.classList.remove('selected');
                            });
                            paperItem.classList.add('selected');
                            selectedPaper = paper.filename;
                            checkReady();
                        });
                        paperList.appendChild(paperItem);
                    });
                } else {
                    document.getElementById('paperList').innerHTML = 
                        '<div class="error">논문 목록을 불러올 수 없습니다.</div>';
                }
            } catch (error) {
                console.error('논문 목록 로드 오류:', error);
                document.getElementById('paperList').innerHTML = 
                    '<div class="error">서버 연결 오류가 발생했습니다.</div>';
            }
        }

        // 모드 선택
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => {
                    b.classList.remove('selected');
                });
                btn.classList.add('selected');
                selectedMode = btn.dataset.mode;
                checkReady();
            });
        });

        // 시작 가능 여부 확인
        function checkReady() {
            const startBtn = document.getElementById('startBtn');
            if (selectedPaper && selectedMode) {
                startBtn.disabled = false;
            } else {
                startBtn.disabled = true;
            }
        }

        // 시작 버튼 클릭
        document.getElementById('startBtn').addEventListener('click', async () => {
            if (!selectedPaper || !selectedMode) return;

            // 로컬 스토리지에 저장
            localStorage.setItem('selectedPaper', selectedPaper);
            localStorage.setItem('selectedMode', selectedMode);

            // 해당 모드 페이지로 이동
            if (selectedMode === 'talk') {
                window.location.href = '/talk.html';
            } else {
                window.location.href = '/text.html';
            }
        });

        // 페이지 로드 시 논문 목록 가져오기
        loadPapers();
    </script>
    <script src="/register-sw.js"></script>
</body>
</html>
